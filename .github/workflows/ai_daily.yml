name: AI Daily Briefing

on:
  schedule:
    # 每天跑两次，避免 GitHub Actions 排队跳过
    # UTC 1:00 = 北京时间 9:00（主运行，抓取当天最新内容）
    # UTC 4:00 = 北京时间 12:00（备用，防止第一次被跳过或延迟）
    - cron: '0 1 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:    # 允许手动触发
    inputs:
      mode:
        description: '运行模式'
        type: choice
        required: true
        default: 'daily'
        options:
          - daily       # 每日正常运行（生成当天 + 发邮件）
          - backfill    # 补历史数据（生成指定日期范围的数据，不发邮件）

permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只运行一个 workflow，新的会取消旧的
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # ── 每日模式（schedule 或 workflow_dispatch daily） ──
      - name: Generate daily briefing & update data.json
        if: ${{ github.event.inputs.mode != 'backfill' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTP_PROXY }}
          # Email config (参见 GitHub Secrets)
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
        run: |
          python ai_daily.py --update-json --max-news 35 --send-email
          echo "data.json updated:"
          python -c "import json; d=json.load(open('data.json')); print(f'  {len(d)} days, latest: {d[0][\"date\"]} ({d[0][\"weekday\"]}), {len(d[0][\"news\"])} news items')"

      # ── 补数据模式（workflow_dispatch backfill） ──
      - name: Backfill historical data (no email)
        if: ${{ github.event.inputs.mode == 'backfill' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTP_PROXY }}
        run: |
          python backfill.py

      - name: Commit & push data.json back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # Only commit if data.json actually changed (prevents empty commits)
          git diff --cached --quiet || git commit -m "chore: update data.json for $(date +'%Y-%m-%d')"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'    # 上传整个目录（index.html + data.json）

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
